name: Make preview video

# Builds the episodes listed below WITH the narrator voice (reachable from GitHub, not from Claude's
# workspace) and saves each video + thumbnail to the "previews" branch.
# Runs on every push to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      episodes:
        description: 'Episodes to build (space separated slugs)'
        default: 'wire cell'

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  voice:
    # The narrator (Kokoro needs Python 3.10-3.12) is recorded on a plain runner - no apt needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-v1-${{ hashFiles('requirements-voice.txt') }}
      - name: Voice packages (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt
      - name: Record narration
        run: python make_voice.py ${{ inputs.episodes || 'wire cell' }}
      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: narration/

  build:
    needs: voice
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Manim's own image already has ffmpeg (with libass for captions), Cairo and Pango,
    # so the build never waits on Ubuntu's apt mirrors.
    container:
      image: manimcommunity/manim:stable
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: git (for checkout + saving previews)
        timeout-minutes: 5
        run: |
          (command -v git || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates)) >/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v5
      - name: Fonts
        run: mkdir -p ~/.fonts && cp assets/fonts/*.ttf assets/fonts/*.otf ~/.fonts/ && fc-cache -f
      - uses: actions/download-artifact@v4
        with:
          name: narration
          path: narration/
      - name: Python packages
        run: pip install -r requirements.txt || pip install --break-system-packages -r requirements.txt
      - name: Make the videos
        run: |
          for e in ${{ inputs.episodes || 'wire cell' }}; do python make_short.py "$e"; done
      - name: Save to the previews branch
        run: |
          mkdir -p /tmp/p && cp out/*.mp4 out/*_thumb.jpg /tmp/p/
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git fetch origin previews || true
          git checkout --orphan previews-new
          git rm -rq --cached . && rm -rf -- * .github .gitignore
          mkdir previews && cp /tmp/p/* previews/
          echo "Built from ${GITHUB_SHA}" > previews/README.md
          git add previews && git commit -qm "Preview from ${GITHUB_SHA::7}"
          git push -f origin previews-new:previews
