name: Make preview videos

# Builds the next episodes due to upload (or the ones you name) with the narrator, and saves
# each video + thumbnail to the "previews" branch so they can be checked before they go out.
on:
  push:
    branches: [main]
    paths-ignore: ['state/**', 'README.md']
  workflow_dispatch:
    inputs:
      episodes:
        description: 'Episodes to build (space separated slugs; empty = next two due)'
        default: ''

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      episodes: ${{ steps.p.outputs.episodes }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          e="${{ inputs.episodes }}"
          [ -z "$e" ] && e="$(python3 scripts/pick_next.py 2)"
          echo "episodes=$e" >> "$GITHUB_OUTPUT"; echo "Building: $e"

  make:
    needs: pick
    if: needs.pick.outputs.episodes != ''
    uses: ./.github/workflows/make.yml
    with:
      episodes: ${{ needs.pick.outputs.episodes }}

  publish:
    needs: make
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: videos
          path: /tmp/p
      - name: Save to the previews branch
        run: |
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git checkout --orphan previews-new
          git rm -rq --cached . && rm -rf -- * .github .gitignore
          mkdir previews && cp /tmp/p/* previews/
          echo "Built from ${GITHUB_SHA}" > previews/README.md
          git add previews && git commit -qm "Preview from ${GITHUB_SHA::7}"
          git push -f origin previews-new:previews
