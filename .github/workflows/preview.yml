name: Make preview video

# Builds the episodes listed below WITH the narrator voice (reachable from GitHub, not from Claude's
# workspace) and saves each video + thumbnail to the "previews" branch.
# Runs on every push to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      episodes:
        description: 'Episodes to build (space separated slugs)'
        default: 'wire cell'

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System packages (ffmpeg, Pango for text, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libpango1.0-dev libcairo2-dev pkg-config fonts-inter fonts-jetbrains-mono espeak-ng
          mkdir -p ~/.fonts && cp assets/fonts/*.ttf ~/.fonts/ && fc-cache -f
      - name: Python packages (CPU-only torch for the Kokoro voice)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-voice-v1
      - name: Make the videos
        run: |
          for e in ${{ inputs.episodes || 'wire cell' }}; do python make_short.py "$e"; done
      - name: Save to the previews branch
        run: |
          mkdir -p /tmp/p && cp out/*.mp4 out/*_thumb.jpg /tmp/p/
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git fetch origin previews || true
          git checkout --orphan previews-new
          git rm -rq --cached . && rm -rf -- * .github .gitignore
          mkdir previews && cp /tmp/p/* previews/
          echo "Built from ${GITHUB_SHA}" > previews/README.md
          git add previews && git commit -qm "Preview from ${GITHUB_SHA::7}"
          git push -f origin previews-new:previews
